services:
  postgres:
    image: postgres:16-alpine
    container_name: smc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smc
      POSTGRES_PASSWORD: smc
      POSTGRES_DB: smc
    ports:
      - "5433:5432"
    volumes:
      - smc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smc -d smc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smc-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - smc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smc_pg:
  smc_redis:
