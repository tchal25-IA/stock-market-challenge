name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Déploie depuis la racine. Les projets Vercel ont rootDirectory = backend | mobile.
# On évite `vercel build --prebuilt` (casse souvent le bake SQLite / chemins monorepo).
jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root deps (workspaces)
        run: npm ci
      - name: Deploy API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Secrets Vercel API manquants — skip deploy API"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root deps (workspaces)
        run: npm ci
      - name: Deploy mobile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOBILE }}
          EXPO_PUBLIC_API_URL: https://stock-market-challenge-api.vercel.app/api
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Secrets Vercel mobile manquants — skip deploy app"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
